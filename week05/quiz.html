<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Along</title>
    <link rel="stylesheet" href="styles/quiz-style.css">
</head>
<body>
    <main>
        <h1>Basic CSS Quiz</h1>

        <form action="#">

            <div>
                <label for="q1">1. Fill in the blank:  ___ Syle Sheets</label>
                <input type="text" name="q1" id="q1">
            </div>

            <div>
                <label for="q2">2. What is the CSS Box Model?</label>
                <textarea name="q2" id="q2" rows="8"></textarea>
            </div>
            
            <div>
                <label for="q3">3. Which one is a CSS Class Selector?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one ...</option>
                    <option value="id">#header { font-size: 24px; }</option>
                    <option value="element">p { color: blue; }</option>

                    <option value="class">.box { background: yellow; }</option>

                </select>
            </div>
            
            <div>
                <label for="q4">4. What is the bottom margin in this declaration?</label>
                <div class="code">
                    margin: 10px auto 12px;
                </div>
                <input type="text" name="q4" id="q4">
            </div>
            
            <div>
                <button type="submit">Submit Quiz</button>
            </div>

        </form>

    </main>
</body>
</html>
