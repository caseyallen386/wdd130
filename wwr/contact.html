<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover unforgettable white water rafting adventures with safe, guided trips, stunning river views, and excitement for the whole family.">
    <meta name="author" content="Casey Allen">
    <title>Contact Us | White Water Rafting</title>

    


    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    
    <header>

        <img src="images/logo-transparent.png" alt="Rafting Logo">
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        
        </nav>
    </header>
    <main>
        <section>
            <div class="address">
                <h1>White Water Rafting</h1>
                <p>123 somestreet</p>
                <p>Salt Lake City, Utah</p>
                <p>(801) 999-5555</p>
                <p>casey@fakemail.com</p>
            </div>
        
            <div class="contact">
                <div class="map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d174984.56293316028!2d-112.08574505685358!3d40.777062274631504!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sus!4v1785374551041!5m2!1sen!2sus" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
                <div class="contact-form">
                    <form action="#">
                        <div class="contact-info">
                            <label for="name">Name:</label>
                            <input type="text" name="name" id="name">
                        </div>
                        <div class="contact-info">
                            <label for="email">Email:</label>
                            <input type="email" name="email" id="email">
                        </div>
                        <div class="message-purpose">
                            
                            <div>
                                <p>Message Purpose</p>
                            </div>
                            
                            <div>
                                <div class="radio">
                                    <input type="radio" name="message-purpose" id="general" value="General Inqu">
                                    <label for="general">General Inquiry</label>
                                </div>
                                <div class="radio">
                                    <input type="radio" name="message-purpose" id="reservation" value="">
                                    <label for="reservation">Reservation Question</label>
                                </div>
                                <div class="radio">
                                    <input type="radio" name="message-purpose" id="sugestion" value="">
                                    <label for="sugestion">Website Suggestion</label>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label for="message-body">Message</label>
                            <textarea name="message-body" id="message-body" rows="8"></textarea>
                        </div>
                        <div>
                            <input type="checkbox" name="subscribe" id="subscribe">
                            <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                        </div>
                        <div>
                            <button type="submit" class="button">Send Message</button>
                        </div>

                    </form>
                </div>
            </div>
        </section>
           
        <section class="adventure">
            
             <h2>We Are Here To Serve You</h2>
             <figure>
                <img src="images/bhandari.jpg" alt="Customer Service Rep">
                <figcaption>
                    Customer Service Rep
                </figcaption>
             </figure>
            <figure>
                <img src="images/vince.jpg" alt="Tour Guide Supervisor">
                <figcaption>
                    Tour Guide Supervisor
                </figcaption>
            </figure>
            <figure>
                <img src="images/joelle.jpg" alt="Trip Planning Specialist">
                <figcaption>
                    Trip Planning Specialist
                </figcaption>
            </figure>
            
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy;2026 | White Water Rafting | Casey Allen</p>
        </div>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook-icon.png" alt="">
            </a>
            
            <a href="https://www.instagram.com/">
                <img src="images/insta-icon.png" alt="x">
            </a>
            
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin-icon.png" alt="linkedin">
            </a>
            
        </nav>
    </footer>


</body>
</html>
